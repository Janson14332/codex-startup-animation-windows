name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: choco install ffmpeg --no-progress -y
      - run: npm run test:media
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-project
          path: |
            dist/*.zip
            dist/*.sha256
