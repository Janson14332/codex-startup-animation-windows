name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($file.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($failed) { exit 1 }
      - name: Shortcut installer creates a hidden launcher
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shortcuts'; New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & .\tools\install.ps1 -ShortcutDirectory $dir
          $shell = New-Object -ComObject WScript.Shell
          $links = @(Get-ChildItem -LiteralPath $dir -Filter *.lnk)
          if ($links.Count -ne 3) { Write-Host "expected 3 shortcuts, got $($links.Count)"; exit 1 }
          $launch = $null
          foreach ($file in $links) {
            # Read through an ASCII copy: WScript.Shell cannot open non-ANSI file names here either.
            $copy = Join-Path $env:RUNNER_TEMP 'probe.lnk'; Copy-Item -LiteralPath $file.FullName -Destination $copy -Force
            $link = $shell.CreateShortcut($copy)
            if ($link.Arguments -match 'launch-windows\.ps1') { $launch = $link }
          }
          if (-not $launch) { Write-Host 'launch shortcut not found'; exit 1 }
          Write-Host "$($launch.TargetPath) $($launch.Arguments)"
          if ($launch.Arguments -notmatch '-Notify' -or $launch.Arguments -notmatch 'Hidden') { exit 1 }
      - run: npm test
      - run: choco install ffmpeg --no-progress -y
      - run: npm run test:media
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-project
          path: |
            dist/*.zip
            dist/*.sha256
